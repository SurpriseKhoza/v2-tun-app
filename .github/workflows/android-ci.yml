name: Android CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build libXray AAR and V2-TUN APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      variant: ${{ steps.signing.outputs.variant }}

    steps:
      - name: Check out V2-TUN
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Check out SSH-enabled libXray
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: feature/ssh-payload-engine
          path: libxray
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: libxray/go.sum

      - name: Add Go tools to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Cache Go and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/go/pkg/mod
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: android-ci-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/gradle-wrapper.properties', '**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            android-ci-${{ runner.os }}-

      - name: Test libXray
        working-directory: libxray
        run: go test ./... -count=1

      - name: Build libXray Android AAR
        working-directory: libxray
        env:
          LIBXRAY_ANDROID_API: '24'
        run: python3 build/main.py android

      - name: Inject generated AAR into V2-TUN
        shell: bash
        run: |
          test -s libxray/libXray.aar
          rm -f app/libs/libXray.aar
          cp libxray/libXray.aar app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Decode signing keystore and select APK variant
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$LOCAL_PROPERTIES" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            test -s app/release.keystore
            chmod 600 app/release.keystore
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found; building release APK."
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "Signing secrets unavailable (e.g. pull request from a fork); building debug APK."
          fi

      - name: Run V2-TUN unit tests and assemble selected APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ "${{ steps.signing.outputs.variant }}" = "release" ]; then
            ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore

      - name: Upload selected APK
        uses: actions/upload-artifact@v4
        with:
          name: V2-TUN-${{ steps.signing.outputs.variant }}-${{ github.sha }}
          path: app/build/outputs/apk/${{ steps.signing.outputs.variant }}/app-${{ steps.signing.outputs.variant }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated libXray AAR
        uses: actions/upload-artifact@v4
        with:
          name: libXray-ssh-${{ github.sha }}
          path: libxray/libXray.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            app/build/test-results/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

  # Runs only for version tags (v*) when the APK was signed with the release key.
  publish-release:
    name: Attach signed APK to the release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-android.outputs.variant == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@v4
        with:
          name: V2-TUN-release-${{ github.sha }}
          path: dist

      - name: Name the APK after the tag
        run: mv dist/app-release.apk "dist/V2-TUN-${GITHUB_REF_NAME}.apk"

      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/V2-TUN-${{ github.ref_name }}.apk
          generate_release_notes: true
